version: 2.1

executors:
  android:
    docker:
      - image: cimg/android:2024.01.1
    resource_class: large
    working_directory: ~/xmrwallet

jobs:
  build_debug_apk:
    executor: android
    steps:
      - checkout
      
      - restore_cache:
          keys:
            - gradle-cache-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - gradle-cache-
      
      - run:
          name: Set up JDK 17
          command: |
            apt-get update && apt-get install -y openjdk-17-jdk
            update-alternatives --install /usr/bin/java java /usr/lib/jvm/java-17-openjdk-amd64/bin/java 1
      
      - run:
          name: Build Debug APK
          command: |
            chmod +x gradlew
            ./gradlew assembleMainnetProdDebug --stacktrace --info
      
      - save_cache:
          paths:
            - ~/.gradle
          key: gradle-cache-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
      
      - store_artifacts:
          path: app/build/outputs/apk
          destination: apk
      
      - persist_to_workspace:
          root: .
          paths:
            - app/build/outputs/apk

  build_release_apk:
    executor: android
    steps:
      - checkout
      
      - restore_cache:
          keys:
            - gradle-cache-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - gradle-cache-
      
      - run:
          name: Set up JDK 17
          command: |
            apt-get update && apt-get install -y openjdk-17-jdk
            update-alternatives --install /usr/bin/java java /usr/lib/jvm/java-17-openjdk-amd64/bin/java 1
      
      - run:
          name: Build Release APK
          command: |
            chmod +x gradlew
            ./gradlew assembleMainnetProdRelease --stacktrace --info
      
      - save_cache:
          paths:
            - ~/.gradle
          key: gradle-cache-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
      
      - store_artifacts:
          path: app/build/outputs/apk
          destination: apk-release
      
      - persist_to_workspace:
          root: .
          paths:
            - app/build/outputs/apk

  build_stagenet_apk:
    executor: android
    steps:
      - checkout
      
      - restore_cache:
          keys:
            - gradle-cache-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - gradle-cache-
      
      - run:
          name: Set up JDK 17
          command: |
            apt-get update && apt-get install -y openjdk-17-jdk
            update-alternatives --install /usr/bin/java java /usr/lib/jvm/java-17-openjdk-amd64/bin/java 1
      
      - run:
          name: Build Stagenet Release APK
          command: |
            chmod +x gradlew
            ./gradlew assembleStagenetProdRelease --stacktrace --info
      
      - save_cache:
          paths:
            - ~/.gradle
          key: gradle-cache-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
      
      - store_artifacts:
          path: app/build/outputs/apk
          destination: apk-stagenet

  publish_release:
    executor: android
    steps:
      - checkout
      - attach_workspace:
          at: .
      
      - run:
          name: Install GitHub CLI
          command: |
            apt-get update
            apt-get install -y gh
      
      - run:
          name: Create GitHub Release
          command: |
            VERSION=$(cat gradle.properties | grep versionName | cut -d'=' -f2 | tr -d ' ')
            TAG="v${VERSION}"
            gh release create $TAG \
              app/build/outputs/apk/mainnetProd/release/*.apk \
              app/build/outputs/apk/stagenetProd/release/*.apk \
              --title "Monerujo $VERSION" \
              --notes "Automatic build from CircleCI" \
              || echo "Release already exists"
          environment:
            GITHUB_TOKEN: ${GITHUB_TOKEN}

workflows:
  version: 2
  build_on_push:
    jobs:
      - build_debug_apk:
          filters:
            branches:
              only:
                - master
                - main
      - build_release_apk:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - publish_release:
          requires:
            - build_release_apk
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/

  nightly_build:
    triggers:
      - schedule:
          cron: "0 2 * * *"  # 每天 UTC 2:00 构建
          filters:
            branches:
              only:
                - master
    jobs:
      - build_debug_apk
      - build_stagenet_apk
