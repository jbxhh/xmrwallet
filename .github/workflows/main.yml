name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: 配置 JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 增加虚拟内存 (Swap)
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 4

    - name: 下载并配置 NDK r17c
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r17c-linux-x86_64.zip
        unzip -q android-ndk-r17c-linux-x86_64.zip -d $HOME/
        echo "ndk.dir=$HOME/android-ndk-r17c" > local.properties
        echo "sdk.dir=$ANDROID_HOME" >> local.properties

    - name: 克隆 Monero C++ 依赖库
      run: |
        mkdir -p external-libs
        git clone https://github.com/m2049r/monero.git external-libs/monero
        cd external-libs/monero
        git checkout release-v0.17.1.9-monerujo || true

    - name: 授予 Gradle 执行权限
      run: chmod +x gradlew

    # 【关键修改在这里】改用最标准的 assembleDebug 命令
    - name: 编译 APK
      run: ./gradlew assembleDebug

    - name: 上传 APK 文件
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/**/*.apk
