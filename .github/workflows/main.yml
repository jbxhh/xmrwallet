name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: 增加虚拟内存 (Swap)
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 4

    - name: 授予 Gradle 执行权限
      run: chmod +x gradlew

    # 直接使用项目自带的脚本在 Docker 中完成全部 C++ 编译和打包
    - name: 使用 Docker 编译 APK
      run: ./build.sh

    - name: 上传 APK 文件
      uses: actions/upload-artifact@v4
      with:
        name: xmr-debug-apk
        path: app/build/outputs/apk/**/*.apk
